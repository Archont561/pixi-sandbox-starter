# Generated by pixi-sandbox init. Regenerate this file instead of editing it.
# pixi-sandbox-version: 0.7.0
name: publish sandbox

on:
  push:
    branches: [main]
  # A bare `schedule:` run and a `workflow_dispatch` naming `upgrade` both route to the
  # `upgrade` job below instead of an ordinary publish — see that job's `if:` and its
  # neighbours'. Leaving `upgrade` blank on a manual dispatch keeps today's behaviour exactly.
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      upgrade:
        description: >-
          Exact pixi-sandbox version to propose in an upgrade pull request (for example
          1.2.3). Leave blank for an ordinary manual publish run.
        required: false
        default: ""

permissions:
  contents: write

env:
  PIXI_SANDBOX_VERSION: 0.7.0
  PIXI_SANDBOX_CHANNEL: https://prefix.dev/archont561/archont561

jobs:
  plan:
    # The weekly schedule and an `upgrade`-naming dispatch both belong to the `upgrade` job
    # instead; an ordinary dispatch (the input left blank) still runs the normal publish.
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.upgrade == '')
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: prefix-dev/setup-pixi@9dabb60412d3d2d967a8d682f7ce01317af40514 # v0.11.0
        with:
          run-install: false
      - name: Install pixi-sandbox CLI
        shell: bash
        run: >-
          pixi global install
          --channel "$PIXI_SANDBOX_CHANNEL"
          --channel conda-forge
          "pixi-sandbox==${PIXI_SANDBOX_VERSION}"
      - id: plan
        shell: bash
        run: echo "matrix=$(pixi-sandbox plan --config pixi-sandbox.toml --json)" >> "$GITHUB_OUTPUT"

  publish:
    needs: plan
    strategy:
      fail-fast: false
      # `include:` nested under `matrix:`, not `matrix:` itself. `plan --json` emits
      # {"schema":1,"include":[...]}, and Actions requires strategy.matrix to be an object.
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix).include }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@9dabb60412d3d2d967a8d682f7ce01317af40514 # v0.11.0
        with:
          run-install: false
      - name: Install pixi-sandbox CLI
        shell: bash
        run: >-
          pixi global install
          --channel "$PIXI_SANDBOX_CHANNEL"
          --channel conda-forge
          "pixi-sandbox==${PIXI_SANDBOX_VERSION}"

      # Bootstrap exception (task-76 AC#4): this step downloads the pinned binary that
      # everything below runs as, so it cannot use that binary as its own entrypoint. It is
      # one checksum-verified command, cross-platform — `fetch-release` resolves this
      # runner's release asset and verifies it against the release's SHA256SUMS.
      - name: Fetch the pinned pixi-sandbox release
        shell: bash
        env:
          # The checksum-verified standalone binary this job drives everything with. The
          # workflow decides when; the tool decides how.
          PIXI_SANDBOX_BIN: ${{ runner.temp }}/pixi-sandbox${{ runner.os == 'Windows' && '.exe' || '' }}
        run: pixi-sandbox fetch-release --dest "$PIXI_SANDBOX_BIN" --version "$PIXI_SANDBOX_VERSION"

      # One cross-platform step where the per-platform Bash/PowerShell twins used to be:
      # install each environment, pack, verify (budgets included), publish — with per-phase
      # outcome recording and a step summary on failure, all inside `pipeline`.
      - name: Pack, verify, and publish
        shell: bash
        env:
          PIXI_SANDBOX_PUSH_TOKEN: ${{ github.token }}
          PIXI_SANDBOX_BIN: ${{ runner.temp }}/pixi-sandbox${{ runner.os == 'Windows' && '.exe' || '' }}
        run: >-
          "$PIXI_SANDBOX_BIN" pipeline
          --envs "${{ matrix.environments }}"
          --platform "${{ matrix.platform }}"
          --branch "${{ matrix.branch }}"
          --remote "${{ github.server_url }}/${{ github.repository }}.git"
          --config pixi-sandbox.toml
          --cargo-vendor "${{ matrix.cargo_vendor }}"
          --transport-dir "${{ runner.temp }}/pixi-sandbox-transport"
          --log-dir "${{ runner.temp }}/pixi-sandbox-logs"

      - name: Upload publish diagnostic log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: publish-diagnostics-${{ matrix.platform }}
          path: ${{ runner.temp }}/pixi-sandbox-logs
          if-no-files-found: ignore
          retention-days: 7

  upgrade:
    name: upgrade
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.upgrade != '')
    runs-on: ubuntu-latest
    # A job-level `permissions:` block replaces, not adds to, the workflow-level one above
    # (the same trap `relock.yml` documents): `pull-requests: write` has to be named here
    # explicitly, alongside `contents: write`, or the pull request below gets a 403.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Workflow files require the optional Workflows-capable token. The built-in token is
          # still useful for checkout and the artifact-only fallback, but cannot deliver this PR.
          token: ${{ secrets.PIXI_SANDBOX_UPGRADE_TOKEN || github.token }}
          persist-credentials: true
      - uses: prefix-dev/setup-pixi@9dabb60412d3d2d967a8d682f7ce01317af40514 # v0.11.0
        with:
          run-install: false
      - name: Install pixi-sandbox CLI
        shell: bash
        run: >-
          pixi global install
          --channel "$PIXI_SANDBOX_CHANNEL"
          --channel conda-forge
          "pixi-sandbox==${PIXI_SANDBOX_VERSION}"

      # Never trust a package manager's "latest" for anything that ends up in a committed
      # file (ADR-26 / ADR-16): bootstrap the version already pinned above — checksum
      # verified, exactly like the publish job's own bootstrap — then ask that exact binary to
      # self-update in place. Only the verified result of that self-update, never a floating
      # resolver, ever touches a generated file.
      #
      # Bootstrap exception (task-76 AC#4): the single checksum-verified download, the same
      # command as the publish job's.
      - name: Fetch the pinned pixi-sandbox release
        shell: bash
        env:
          PIXI_SANDBOX_BIN: ${{ runner.temp }}/pixi-sandbox
        run: pixi-sandbox fetch-release --dest "$PIXI_SANDBOX_BIN" --version "$PIXI_SANDBOX_VERSION"

      # A manual dispatch names the exact version to propose; the weekly schedule takes the
      # newest release. Two one-line steps instead of one shell conditional, so the pinned
      # binary never sees an empty --version.
      - name: Self-update to the requested version
        if: inputs.upgrade != ''
        shell: bash
        env:
          PIXI_SANDBOX_BIN: ${{ runner.temp }}/pixi-sandbox
        run: '"$PIXI_SANDBOX_BIN" self-update --dest "$PIXI_SANDBOX_BIN" --version "${{ inputs.upgrade }}"'
      - name: Self-update to the latest release
        if: inputs.upgrade == ''
        shell: bash
        env:
          PIXI_SANDBOX_BIN: ${{ runner.temp }}/pixi-sandbox
        run: '"$PIXI_SANDBOX_BIN" self-update --dest "$PIXI_SANDBOX_BIN"'

      # Check, regenerate, commit and deliver — one step, one cross-platform invocation.
      # Config is reviewed data, never rewritten by `init` or this job (ADR-16): only the three
      # owned paths are ever staged. A workflow-capable token is optional: without it the
      # step leaves the patch artifact and a precise hand-off, rather than turning every
      # consumer's weekly schedule red.
      - name: Upgrade the owned files
        shell: bash
        env:
          PIXI_SANDBOX_UPGRADE_TOKEN: ${{ secrets.PIXI_SANDBOX_UPGRADE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.PIXI_SANDBOX_UPGRADE_TOKEN || github.token }}
          PIXI_SANDBOX_BIN: ${{ runner.temp }}/pixi-sandbox
        run: >-
          "$PIXI_SANDBOX_BIN" upgrade
          --github-workflow-path .github/workflows/publish-sandbox.yml
          --relock-workflow-path .github/workflows/relock.yml
          --relock-ci-workflow ci.yml
          --script-path scripts/restore.sh
          --config pixi-sandbox.toml
          --branch sandbox/developer-linux-64
          --artifact-dir "${{ runner.temp }}/pixi-sandbox-upgrade"
          --repo "${{ github.repository }}"

      - name: Upload upgrade patch and delivery report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pixi-sandbox-upgrade-artifacts
          path: ${{ runner.temp }}/pixi-sandbox-upgrade
          if-no-files-found: ignore
          retention-days: 14
